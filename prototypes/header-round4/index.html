<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OUJI 彩妝頁頂 — 五方向樣稿</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    #stage { width: 100%; height: 100%; border: 0; display: block; }
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  </style>
</head>
<body>
  <iframe id="stage" title="Prototype preview"></iframe>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">雜誌</button>
    <button class="proto-picker-item">藥妝店</button>
    <button class="proto-picker-item">月白</button>
    <button class="proto-picker-item">字體實驗</button>
    <button class="proto-picker-item">貼紙機</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <script>
    const files = ["editorial.html", "drugstore.html", "moonlight.html", "type-lab.html", "sticker-booth.html"];
    const stage = document.getElementById("stage");
    const picker = document.querySelector(".proto-picker");
    const highlight = picker.querySelector(".proto-picker-highlight");
    const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
    const replay = picker.querySelector(".proto-picker-replay");
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + "px";
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }
    function mount(i) {
      stage.src = "about:blank";
      requestAnimationFrame(() => { stage.src = files[i]; });
    }
    function setActive(i) {
      if (i < 0 || i >= files.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute("data-active", j === i);
        if (j === i) el.setAttribute("aria-current", "true");
        else el.removeAttribute("aria-current");
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set("v", i + 1);
      history.replaceState(null, "", url);
      mount(i);
    }
    items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
    replay.addEventListener("click", () => mount(current));
    window.addEventListener("resize", moveHighlight);
    document.addEventListener("keydown", (event) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const num = parseInt(event.key, 10);
      if (num >= 1 && num <= files.length) setActive(num - 1);
      else if (event.key === "ArrowRight") setActive((current + 1) % files.length);
      else if (event.key === "ArrowLeft") setActive((current - 1 + files.length) % files.length);
      else if (event.key === "r" || event.key === "R") mount(current);
    });
    setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
  </script>
</body>
</html>
