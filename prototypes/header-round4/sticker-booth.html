<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貼紙相機 — OUJI 彩妝</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <style>
    :root { --pink: #ff70bd; --blue: #5d73ff; --lime: #cbff48; --yellow: #ffd64d; --silver: #d8d9e5; }
    .booth {
      position: relative;
      min-height: 350px;
      overflow: hidden;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 1px, transparent 1px 6px),
        linear-gradient(135deg, #cdd0dc, #f2f2f7 46%, #bfc2d1);
      color: #13141a;
    }
    .booth__title {
      position: absolute;
      left: clamp(18px, 5vw, 76px);
      top: 24px;
      z-index: 4;
      transform: rotate(-3deg);
    }
    .booth__title h1 {
      margin: 0;
      font-family: "Bagel Fat One", "Noto Sans TC", sans-serif;
      font-size: clamp(50px, 6vw, 76px);
      font-weight: 400;
      line-height: .82;
      color: var(--blue);
      -webkit-text-stroke: 2px #101218;
      text-shadow: 4px 6px 0 var(--lime);
    }
    .booth__title p {
      display: inline-block;
      margin: 10px 0 0 8px;
      padding: 6px 10px;
      background: #101218;
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
    }
    .booth__strip {
      position: absolute;
      top: 20px;
      right: clamp(28px, 12vw, 180px);
      width: clamp(154px, 16vw, 205px);
      padding: 8px;
      background: white;
      box-shadow: 0 24px 55px rgba(25,28,50,.28);
      transform: rotate(4deg);
      animation: strip-in 480ms cubic-bezier(.23, 1, .32, 1) both;
    }
    .booth__strip::after {
      content: "OUJI PHOTO CLUB · 182 / 23";
      display: block;
      padding: 9px 2px 2px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
      text-align: center;
    }
    .booth__frames { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .booth__frames img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #eceef1; }
    .booth__collage { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .booth__word-face {
      position: absolute;
      left: 32%;
      top: 43px;
      transform: rotate(2deg);
      color: var(--pink);
      font-family: "Bagel Fat One", "Noto Sans TC", sans-serif;
      font-size: clamp(30px, 4vw, 55px);
      line-height: .78;
      -webkit-text-stroke: 1.5px #11131a;
      text-shadow: 3px 4px 0 white;
    }
    .booth__word-face span { display: block; margin-left: 24px; color: var(--blue); }
    .booth__word-face small {
      display: block;
      width: max-content;
      margin: 11px 0 0 42px;
      padding: 5px 8px;
      background: #11131a;
      color: white;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 9px;
      letter-spacing: .08em;
      -webkit-text-stroke: 0;
      text-shadow: none;
    }
    .booth__kiss {
      position: absolute;
      left: 48%;
      top: 155px;
      width: 98px;
      color: var(--pink);
      filter: drop-shadow(3px 4px 0 white);
      transform: rotate(-11deg);
    }
    .booth__flash-word {
      position: absolute;
      left: 67%;
      top: 186px;
      padding: 8px 13px;
      border: 2px solid #11131a;
      border-radius: 50% 42% 48% 45%;
      background: var(--yellow);
      font-family: "Bagel Fat One", "Noto Sans TC", sans-serif;
      font-size: 20px;
      transform: rotate(9deg);
      box-shadow: 3px 4px 0 rgba(17,19,26,.24);
    }
    .booth__stickers {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 14px;
      width: min(650px, calc(100% - 28px));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(6px, 1.1vw, 12px);
      transform: translateX(-50%);
    }
    .booth__stickers button {
      position: relative;
      min-width: 0;
      min-height: 72px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 1px;
      border: 2px solid #11131a;
      padding: 5px 4px 7px;
      color: #11131a;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 3px 4px 0 rgba(17,19,26,.28);
      transition: transform 160ms ease-out;
    }
    .booth__stickers button:hover { transform: translateY(-4px) rotate(0) !important; }
    .booth__stickers button[data-active] { background: #11131a !important; color: white; border-color: white; }
    .booth__stickers button b { font-size: 11px; line-height: 1; }
    .booth__stickers button small {
      position: absolute;
      top: 5px;
      right: 6px;
      min-width: 20px;
      padding: 2px 4px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 8px;
      line-height: 1;
    }
    .booth__sticker-icon { width: 40px; height: 40px; overflow: visible; }
    .booth__sticker-icon * { vector-effect: non-scaling-stroke; }
    .booth__stickers button:nth-child(1) { border-radius: 50% 42% 48% 45%; background: var(--pink); transform: rotate(-4deg); }
    .booth__stickers button:nth-child(2) { border-radius: 44% 52% 43% 55%; background: var(--lime); transform: rotate(3deg); }
    .booth__stickers button:nth-child(3) { border-radius: 52% 42% 55% 45%; background: #fff; transform: rotate(-2deg); }
    .booth__stickers button:nth-child(4) { border-radius: 43% 55% 48% 52%; background: var(--yellow); transform: rotate(4deg); }
    .booth__stickers button:nth-child(5) { border-radius: 55% 45% 42% 52%; background: #98e4ff; transform: rotate(-3deg); }
    .booth__burst {
      position: absolute;
      right: -35px;
      bottom: -50px;
      width: 180px;
      height: 180px;
      background: var(--pink);
      transform: rotate(15deg);
      clip-path: polygon(50% 0, 61% 34%, 90% 10%, 70% 40%, 100% 50%, 67% 59%, 91% 88%, 60% 69%, 50% 100%, 40% 68%, 10% 90%, 33% 59%, 0 50%, 32% 40%, 10% 11%, 40% 33%);
    }
    .booth__flash { position: absolute; inset: 0; z-index: 20; pointer-events: none; background: white; animation: flash 520ms ease-out both; }
    @keyframes flash { 0%, 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes strip-in { from { opacity: 0; transform: translateY(-70px) rotate(9deg); } to { opacity: 1; transform: rotate(4deg); } }
    @media (max-width: 720px) {
      .booth { min-height: 350px; }
      .booth__title { left: 15px; top: 20px; }
      .booth__title h1 { font-size: 49px; -webkit-text-stroke-width: 1px; text-shadow: 3px 4px 0 var(--lime); }
      .booth__title p { margin-top: 8px; font-size: 9px; }
      .booth__strip { top: 58px; right: 17px; width: 126px; transform: rotate(3deg); }
      @keyframes strip-in { from { opacity: 0; transform: translateY(-55px) rotate(8deg); } to { opacity: 1; transform: rotate(3deg); } }
      .booth__word-face { display: none; }
      .booth__kiss { left: 49%; top: 194px; width: 66px; }
      .booth__flash-word { left: 17px; top: 213px; padding: 5px 9px; font-size: 14px; }
      .booth__stickers { bottom: 12px; width: calc(100% - 20px); gap: 5px; }
      .booth__stickers button { min-height: 68px; padding-inline: 2px; }
      .booth__sticker-icon { width: 34px; height: 34px; }
      .booth__stickers button b { font-size: 10px; }
      .booth__stickers button small { top: 4px; right: 4px; min-width: 18px; font-size: 7px; }
    }
  </style>
</head>
