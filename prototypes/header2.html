<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&text=%E5%BD%A9%E5%A6%9D%E5%BA%95%E7%9C%BC%E5%94%87%E9%A0%B0%E4%BF%AE%E5%AE%B9%E4%BB%B6%E5%80%8B%E5%93%81%E7%89%8C%E9%9F%93%E5%9C%8B%E7%9B%B4%E9%80%81%E5%85%A8%E9%83%A8%E7%8F%BE%E8%B2%A8%E5%90%88%E8%A8%88%E8%89%B2%E8%99%9F%E8%BC%AA%E6%8A%BD%E5%B1%9C%E6%9E%B6%E9%8F%A1%E6%A8%99%E7%B1%A4%E6%87%89%E6%8F%B4%E5%8D%A1%E6%94%B6%E9%8A%80%E7%B4%99%E6%89%8B%E5%AF%AB%E7%87%88%E7%AE%B1%E7%A5%A8%E7%AF%A9%E9%81%B8%E6%8E%92%E5%BA%8F%E6%8E%A8%E8%96%A6%E7%94%A2%E7%8D%B2%E7%8D%8E%E6%84%9F%E9%85%8D%E5%B0%8D%E5%B0%88%E6%AC%84%E6%9C%88%E6%97%A5%E5%89%8D%E5%96%AE%E6%8A%98%E6%BB%BF%E5%85%8D%E9%81%8B%E8%B2%BB%E7%AC%AC%E4%BF%82%E6%96%B0%E5%88%B0%E6%9C%9F%E7%86%B1%E9%96%80%E5%83%B9%E4%BD%8E%E9%AB%98%E4%BA%BA%E6%B0%A3%E4%B8%8A%E5%BA%AB%E5%AD%98%E9%96%80%E5%B8%82%E9%99%90%E5%AE%9A%E5%A5%97%E8%A3%9D%E8%A3%9C%E5%85%85%E9%A6%99%E6%B8%AF%E6%AD%A3%E8%A1%8C%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E5%8D%81%E7%84%A1%E7%8F%BE%E5%98%85%E5%90%8C%E5%9F%8B%E7%94%B1%E8%87%B3&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E5%BD%A9%E5%A6%9D%E5%BA%95%E7%9C%BC%E5%94%87%E9%A0%B0%E4%BF%AE%E5%AE%B9%E4%BB%B6%E5%80%8B%E5%93%81%E7%89%8C%E9%9F%93%E5%9C%8B%E7%9B%B4%E9%80%81%E5%85%A8%E9%83%A8%E7%8F%BE%E8%B2%A8%E5%90%88%E8%A8%88%E8%89%B2%E8%99%9F%E8%BC%AA%E6%8A%BD%E5%B1%9C%E6%9E%B6%E9%8F%A1%E6%A8%99%E7%B1%A4%E6%87%89%E6%8F%B4%E5%8D%A1%E6%94%B6%E9%8A%80%E7%B4%99%E6%89%8B%E5%AF%AB%E7%87%88%E7%AE%B1%E7%A5%A8%E7%AF%A9%E9%81%B8%E6%8E%92%E5%BA%8F%E6%8E%A8%E8%96%A6%E7%94%A2%E7%8D%B2%E7%8D%8E%E6%84%9F%E9%85%8D%E5%B0%8D%E5%B0%88%E6%AC%84%E6%9C%88%E6%97%A5%E5%89%8D%E5%96%AE%E6%8A%98%E6%BB%BF%E5%85%8D%E9%81%8B%E8%B2%BB%E7%AC%AC%E4%BF%82%E6%96%B0%E5%88%B0%E6%9C%9F%E7%86%B1%E9%96%80%E5%83%B9%E4%BD%8E%E9%AB%98%E4%BA%BA%E6%B0%A3%E4%B8%8A%E5%BA%AB%E5%AD%98%E9%96%80%E5%B8%82%E9%99%90%E5%AE%9A%E5%A5%97%E8%A3%9D%E8%A3%9C%E5%85%85%E9%A6%99%E6%B8%AF%E6%AD%A3%E8%A1%8C%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E5%8D%81%E7%84%A1%E7%8F%BE%E5%98%85%E5%90%8C%E5%9F%8B%E7%94%B1%E8%87%B3&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;900&family=Chivo+Mono:wght@400;700&family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&display=swap" rel="stylesheet">
<style>

:root{
 --ink:#14201f;--dim:#6b7b7e;--line:#e6ebec;--paper:#fff;
 --ouji:#2b4c58;              /* 老闆指定：footer 嗰隻藍 */
 --sans:'Noto Sans TC',system-ui,sans-serif;
 --tcserif:'Noto Serif TC',serif;
 --brush:'Ma Shan Zheng',cursive;
 --anton:'Anton',Impact,sans-serif;
 --arch:'Archivo',system-ui,sans-serif;
 --mono:'Chivo Mono',ui-monospace,monospace;
 --bodoni:'Bodoni Moda',Didot,serif;
}
*{box-sizing:border-box}
.grid>*,.v1 .chips>*,.v2 .tabs>*,.v5 .row>*,.v7 .cells>*,.v8 .rail>*,.v10 .labels>*{min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
img{display:block}
.frame{max-width:1200px;margin:0 auto;padding:0 20px}

/* ── 共用外殼（同生產站一樣，唔係設計嘅一部分）───────────────── */
.bar{background:var(--ouji);color:#fff;text-align:center;font-size:.72rem;padding:7px 12px;letter-spacing:.02em}
.nav{border-bottom:1px solid var(--line);background:#fff}
.nav .in{max-width:1200px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:26px}
.nav b{font-family:var(--arch);font-weight:700;letter-spacing:.34em;font-size:.95rem}
.nav a{font-size:.78rem;color:var(--ink);text-decoration:none;opacity:.8}
.tools{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;border-top:1px solid var(--line);margin-top:22px}
.tools .n{font-family:var(--arch);font-size:.76rem;font-weight:700;color:var(--dim)}
.tools .b{display:flex;gap:8px}
.tools .b span{border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:.76rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.tilerow{margin-top:22px}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#f4f6f6}
.pc em{display:block;font-style:normal;font-family:var(--arch);font-size:.62rem;font-weight:700;
 letter-spacing:.12em;color:var(--dim);margin:9px 0 3px}
.pc p{margin:0;font-size:.78rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc b{display:block;font-family:var(--arch);font-size:.82rem;margin-top:5px}
.mark{position:absolute;left:0;right:0;border-top:2px dashed #e0342c;pointer-events:none;z-index:60}
.mark span{position:absolute;left:0;top:-11px;background:#e0342c;color:#fff;font-size:10px;
 font-family:var(--arch);font-weight:700;padding:2px 8px;white-space:nowrap;border-radius:0 3px 3px 0}

/* ══ 1 色票 ══ 顏料本身就係介面。五條放到好大嘅貨相 = 五格色。 */
.v1{position:relative;background:#0f1417}
.v1 .chips{display:grid;grid-template-columns:repeat(5,1fr);height:clamp(230px,26vw,320px)}
.v1 a{position:relative;overflow:hidden;text-decoration:none;display:block;
 transition:flex .4s cubic-bezier(.2,.9,.25,1)}
.v1 a img{width:100%;height:100%;object-fit:cover;transform:scale(2.9);filter:saturate(1.6) contrast(1.08)}
.v1 a::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,20,23,.10),rgba(15,20,23,.78))}
.v1 .chips::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
 background:linear-gradient(100deg,rgba(10,14,16,.66) 0%,rgba(10,14,16,.18) 34%,transparent 52%)}
.v1 .chips{position:relative}
.v1 .plate{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 14px;color:#fff}
.v1 .plate i{display:block;font-style:normal;font-family:var(--mono);font-size:.58rem;
 letter-spacing:.2em;opacity:.72;margin-bottom:4px}
.v1 .plate strong{display:block;font-family:var(--tcserif);font-weight:900;font-size:clamp(1.1rem,2vw,1.5rem);line-height:1}
.v1 .plate u{text-decoration:none;font-family:var(--arch);font-weight:900;font-size:.8rem;opacity:.85}
.v1 h1{position:absolute;z-index:3;left:max(20px,calc((100% - 1200px)/2 + 20px));top:50%;transform:translateY(-50%);margin:0;
 text-align:left;font-family:var(--tcserif);font-weight:900;color:#fff;
 font-size:clamp(3.4rem,11vw,9rem);line-height:.9;letter-spacing:.02em;
 text-shadow:0 6px 40px rgba(0,0,0,.55);pointer-events:none}
.v1 .tot{position:absolute;z-index:3;right:16px;top:12px;
 font-family:var(--mono);font-size:.62rem;letter-spacing:.28em;color:#fff;opacity:.9;pointer-events:none}

/* ══ 2 燈箱 ══ 地鐵站嗰塊背光廣告板。 */
.v2{position:relative;background:#07090b;overflow:hidden}
.v2 .lit{position:relative;height:clamp(260px,30vw,380px)}
.v2 .lit img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;object-position:50% 34%;
 filter:contrast(1.15) saturate(1.1)}
.v2 .lit::after{content:'';position:absolute;inset:0;
 background:radial-gradient(78% 64% at 50% 46%,rgba(190,232,255,.30),transparent 72%),
  linear-gradient(180deg,rgba(7,9,11,.5),rgba(7,9,11,.92))}
.v2 .txt{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:0 0 20px}
.v2 h1{margin:0;font-family:var(--sans);font-weight:900;color:#fff;letter-spacing:-.02em;
 font-size:clamp(3rem,9vw,7.5rem);line-height:.88}
/* 燈箱應該係塊板發光，唔係啲字發光。光暈交返畀 .lit::after 嗰個 radial。 */
.v2 .en{font-family:var(--anton);letter-spacing:.14em;font-size:clamp(.8rem,1.8vw,1.15rem);
 color:#9fe4ff;text-transform:uppercase;margin-bottom:6px}
.v2 .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,.14)}
.v2 .tabs a{background:#0d1216;color:#fff;text-decoration:none;padding:13px 12px;
 display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.v2 .tabs a:hover{background:#16212a}
.v2 .tabs span{font-family:var(--sans);font-weight:700;font-size:.92rem}
.v2 .tabs u{text-decoration:none;font-family:var(--anton);color:#9fe4ff;font-size:.9rem}

/* ══ 3 手寫牌 ══ 香港藥房嗰啲螢光紙手寫價錢牌。 */
.v3{background:#f3f1ec;padding:26px 0 30px}
.v3 .cards{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.v3 .big{flex:none;background:#ff2d1f;color:#fff;padding:18px 24px 20px;
 transform:rotate(-2.5deg);box-shadow:3px 4px 0 rgba(0,0,0,.14)}
.v3 .big em{display:block;font-style:normal;font-family:var(--brush);font-size:1.1rem;opacity:.92}
.v3 .big strong{display:block;font-family:var(--arch);font-weight:900;font-size:4.6rem;line-height:.86;letter-spacing:-.03em}
.v3 .big u{text-decoration:none;font-family:var(--brush);font-size:1.05rem}
.v3 a{flex:none;text-decoration:none;color:#111;padding:16px 22px 18px;min-width:150px;
 box-shadow:2px 3px 0 rgba(0,0,0,.13);display:block}
.v3 a:nth-child(2){background:#ffe94d;transform:rotate(1.6deg)}
.v3 a:nth-child(3){background:#ff9ec7;transform:rotate(-1.2deg)}
.v3 a:nth-child(4){background:#9ef0a8;transform:rotate(2.2deg)}
.v3 a:nth-child(5){background:#ffd08a;transform:rotate(-2deg)}
.v3 a:nth-child(6){background:#a8dcff;transform:rotate(1deg)}
.v3 a:hover{transform:rotate(0) translateY(-3px)}
.v3 a span{display:block;font-family:var(--brush);font-size:1.9rem;line-height:1.1}
.v3 a i{font-style:normal;display:block;font-family:var(--brush);font-size:2.6rem;color:#d81f12;line-height:1}
.v3 .foot{margin-top:16px;font-family:var(--brush);font-size:1.15rem;color:#5c554a}

/* ══ 4 收銀紙 ══ 抽中嘅方向。一張感熱紙，件數就係單據行。 */
.v4{background:linear-gradient(#e6e9e8,#dcdfde);padding:16px 0 0;position:relative}
.v4 .slip{max-width:560px;margin:0 auto;background:#fff;padding:20px 30px 26px;
 font-family:var(--mono);color:#1b1b1b;font-size:.78rem;line-height:1.55;
 box-shadow:0 10px 26px rgba(0,0,0,.13);position:relative}
.v4 .slip::after{content:'';position:absolute;left:0;right:0;bottom:-11px;height:12px;background:#fff;
 -webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 14px);
 mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 14px)}
.v4 .hd{text-align:center;border-bottom:1px dashed #b9b9b9;padding-bottom:12px}
.v4 h1{margin:0 0 2px;font-family:var(--sans);font-weight:900;font-size:1.8rem;letter-spacing:.14em}
.v4 .hd em{font-style:normal;display:block;font-size:.62rem;letter-spacing:.24em;color:#666}
.v4 ul{list-style:none;margin:12px 0 0;padding:0}
.v4 li a{display:flex;align-items:baseline;gap:6px;text-decoration:none;color:inherit;padding:4px 0}
.v4 li a:hover{background:#f4f4f4}
.v4 li .nm{font-family:var(--sans);font-weight:700;font-size:.86rem;white-space:nowrap}
.v4 li .dots{flex:1;border-bottom:1px dotted #bdbdbd;transform:translateY(-4px)}
.v4 li .qt{font-weight:700}
.v4 .sum{border-top:1px dashed #b9b9b9;margin-top:12px;padding-top:10px;
 display:flex;justify-content:space-between;font-weight:700;font-size:.92rem}
.v4 .bc{margin-top:11px;height:26px;
 background:repeating-linear-gradient(90deg,#1b1b1b 0 2px,transparent 2px 4px,#1b1b1b 4px 5px,transparent 5px 9px)}
.v4 .bcn{text-align:center;font-size:.6rem;letter-spacing:.42em;margin-top:5px;color:#555}

/* ══ 5 應援卡 ══ K-pop 小卡＋鐳射咭套。 */
.v5{background:linear-gradient(168deg,#ffe9f2,#e8f0ff);padding:18px 0 20px}
.v5 .row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.v5 a{position:relative;display:block;text-decoration:none;border-radius:9px;overflow:hidden;
 aspect-ratio:3/4;background:#fff;box-shadow:0 8px 20px rgba(20,25,30,.16);
 transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.v5 a:nth-child(odd){transform:rotate(-2deg)}
.v5 a:nth-child(even){transform:rotate(1.6deg)}
.v5 a:hover{transform:rotate(0) translateY(-6px);box-shadow:0 16px 30px rgba(20,25,30,.22)}
.v5 a img{width:100%;height:100%;object-fit:cover}
.v5 a::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
 background:linear-gradient(122deg,rgba(255,0,140,.42),rgba(0,224,255,.42) 32%,rgba(255,238,0,.42) 58%,rgba(140,0,255,.42));
 opacity:.5}
.v5 a .cap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:9px 10px;color:#fff;
 background:linear-gradient(transparent,rgba(30,10,45,.82))}
.v5 a .cap b{display:block;font-size:.95rem}
.v5 a .cap i{font-style:normal;font-family:var(--arch);font-weight:900;font-size:.72rem;opacity:.9}
.v5 .hd{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.v5 h1{margin:0;font-family:var(--sans);font-weight:900;font-size:clamp(1.7rem,4vw,2.6rem);
 letter-spacing:.04em;color:#4a2b5e}
.v5 .hd em{font-style:normal;font-family:var(--arch);font-weight:700;font-size:.7rem;
 letter-spacing:.22em;color:#8a6ba0}

/* ══ 6 色號輪 ══ 專櫃嗰個色號盤。 */
.v6{background:#12161a;padding:26px 0 24px;color:#fff}
.v6 .in{display:flex;align-items:center;gap:clamp(18px,4vw,54px);flex-wrap:wrap}
.v6 .dial{flex:none;width:clamp(150px,20vw,206px);aspect-ratio:1;border-radius:50%;position:relative;
 background:conic-gradient(#e8c9a8 0 20%,#c2708a 20% 40%,#d0433f 40% 60%,#e07a6a 60% 80%,#b98c6a 80% 100%);
 box-shadow:inset 0 0 0 9px #1b2126,0 14px 40px rgba(0,0,0,.5)}
.v6 .dial::after{content:'';position:absolute;inset:32%;border-radius:50%;background:#12161a;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.v6 .dial b{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;
 font-family:var(--arch);font-weight:900;font-size:1.5rem}
.v6 h1{margin:0 0 3px;font-family:var(--tcserif);font-weight:900;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:.03em}
.v6 .sub{font-family:var(--mono);font-size:.66rem;letter-spacing:.24em;color:#8fa3ab;margin-bottom:14px}
.v6 ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.v6 ol a{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;
 border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px 7px 8px;font-size:.86rem}
.v6 ol a:hover{background:rgba(255,255,255,.09)}
.v6 ol a s{text-decoration:none;width:16px;height:16px;border-radius:50%;flex:none}
.v6 ol a u{text-decoration:none;font-family:var(--arch);font-weight:900;font-size:.74rem;color:#8fa3ab}

/* ══ 7 抽屜 ══ 由上望落去嘅亞加力化妝收納格。 */
.v7{background:#b9b3a8;padding:20px 0 22px}

  return `<i style="left:${(50-46*Math.cos(a)).toFixed(1)}%;top:${(52-46*Math.sin(a)).toFixed(1)}%"></i>`}).join('')}</span>
 <h1>MAKEUP</h1><div class="cn">彩妝</div><p>${TOT} 件 · ${BRANDS} 個品牌</p></div></div></section>`,0),

/* 10 標籤紙 */()=>body(`<section class="v10"><div class="frame"><div class="sheet">
 <div class="hd"><h1>彩妝 / MAKEUP</h1><em>TOTAL ${TOT} · ${BRANDS} BRANDS</em></div>
 <div class="labels">${SUB.map((c,i)=>`<a href="#"><b>${q(c.label)}</b><em>OUJI-MK-0${i+1}</em>
  <span class="qt">${c.n}</span><span class="code"></span></a>`).join('')}</div></div></div></section>`,1),
];

const NAMES=['色票','燈箱','手寫牌','收銀紙','應援卡','色號輪','抽屜','貨架','鏡','標籤'];
const stage=document.getElementById('stage'), picker=document.querySelector('.proto-picker');
picker.innerHTML=NAMES.map(n=>`<button class="proto-picker-item">${n}</button>`).join('');
const items=[...picker.querySelectorAll('.proto-picker-item')];
let current=0;
function measure(){
 document.querySelectorAll('.mark').forEach(e=>e.remove());
 const g=document.getElementById('grid'); if(!g) return;
 const y=Math.round(g.querySelector('.pc').getBoundingClientRect().top+scrollY);
 const m=document.createElement('div'); m.className='mark'; m.style.top=y+'px';
 m.innerHTML=`<span>第一件貨 ${y}px　·　Olive Young 係 219px</span>`;
 document.body.appendChild(m);
}
function mount(i){stage.innerHTML=variants[i]();requestAnimationFrame(()=>setTimeout(measure,60));}
function setActive(i){if(i<0||i>=variants.length)return;current=i;
 items.forEach((el,j)=>el.toggleAttribute('data-active',j===i));
 items[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
 try{const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u)}catch(e){}
 mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
addEventListener('resize',()=>setTimeout(measure,80));
addEventListener('load',()=>setTimeout(measure,300));
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
 const n=parseInt(e.key,10);
 if(n>=1&&n<=9)setActive(n-1); else if(e.key==='0')setActive(9);
 else if(e.key==='ArrowRight')setActive((current+1)%10);
 else if(e.key==='ArrowLeft')setActive((current+9)%10);});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
</script></body></html>
