<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>彩妝 header — 十個版本</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@200;300;400;500;700;900&family=Noto+Serif+TC:wght@200;300;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   十個 header。全部用真資料 —— 每張相都係嗰個子分類真正嘅貨，由
   Shopify 攞返再逐格對過（上一版將護膚品嘅相配咗落彩妝標籤，係作嘅）。
   十個係十個諗法，唔係十種間距：
     1 巨字   字大到出血，版面由字撐起
     2 對開   雜誌跨頁，左字右物
     3 標本   博物館牆牌，全部係規格
     4 暗房   一束光、一件貨、一個名
     5 色域   一大片色，字浮喺中間
     6 貨牆   七件貨鋪滿，名撞穿佢
     7 一句   成個 header 得一句說話
     8 索引   子分類做目錄，名做頁碼
     9 本週   由「新到咩」開場，分類名退居第二
    10 鏡面   名反射喺一塊亮面上
   ═══════════════════════════════════════════════════════════════ */
:root{--ink:#14292f;--ink2:#2b4c58;--blue:#6da3b5;--cream:#f6f5f0;--raw:#fdf8f3;
 --dim:#7c878e;--line:rgba(43,76,88,.12);
 --sans:'Noto Sans TC','Manrope',system-ui,sans-serif;--serif:'Noto Serif TC',Georgia,serif;
 --corm:'Cormorant Garamond',Georgia,serif;--num:'Manrope',system-ui,sans-serif;
 --out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.frame{max-width:1180px;margin:0 auto;padding:0 20px}
.bar{background:var(--ink2);color:var(--raw);font-size:.76rem;text-align:center;padding:9px}
.nav{border-bottom:1px solid var(--line);padding:13px 0}
.nav .frame{display:flex;align-items:center;gap:22px}
.logo{font-family:'Manrope';font-weight:700;letter-spacing:.22em;font-size:1rem;color:var(--ink2)}
.nav b{font-size:.8rem;font-weight:500;color:var(--dim)}
/* 共用：子分類 tile ＋ 工具條 ＋ 貨格 */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px 0 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:9px 9px 11px;background:#fff}
.tile i{display:block;aspect-ratio:1;border-radius:7px;overflow:hidden;background:#f6f7f8;margin-bottom:7px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{display:block;font-size:.86rem;font-weight:600}
.tile em{font-style:normal;font-family:var(--num);font-size:.7rem;font-weight:700;color:var(--dim)}
.tools{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);margin-top:16px}
.tools .n{font-family:var(--num);font-size:.78rem;font-weight:700;color:var(--dim)}
.tools .sp{margin-left:auto;display:flex;gap:8px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;
 font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;transition:transform 160ms ease-out}
.tools button:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:14px 0 40px}
.pc i{display:block;aspect-ratio:1;background:#f6f7f8;border-radius:8px;overflow:hidden}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc b{display:block;font-size:.66rem;color:var(--dim);margin:8px 0 2px;font-weight:700}
.pc span{display:block;font-size:.79rem;line-height:1.35;font-weight:500;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mark{position:absolute;left:0;right:0;border-top:1px dashed #e8503f;z-index:40;pointer-events:none}
.mark span{position:absolute;left:8px;top:-19px;background:#e8503f;color:#fff;font-size:.6rem;
 padding:2px 7px;border-radius:3px;font-family:var(--num);font-weight:700}

/* 1 巨字 */
.v1{padding:30px 0 6px;overflow:hidden;position:relative}
.v1 h1{margin:0;font-family:var(--corm);font-weight:300;font-size:clamp(6rem,17vw,15rem);
 line-height:.78;letter-spacing:-.05em;white-space:nowrap;margin-left:-.06em}
.v1 .meta{display:flex;align-items:baseline;gap:16px;margin-top:-.1em;padding-top:14px}
.v1 .meta em{font-style:normal;font-family:var(--num);font-size:.76rem;font-weight:700;color:var(--dim);letter-spacing:.06em}
.v1 .float{position:absolute;right:4%;top:8%;width:min(210px,22vw);aspect-ratio:1;border-radius:14px;
 overflow:hidden;box-shadow:0 30px 60px -30px rgba(20,41,50,.5)}
.v1 .float img{width:100%;height:100%;object-fit:cover;display:block}

/* 2 對開 */
.v2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.v2 .l{padding:52px 0;display:flex;flex-direction:column;justify-content:center}
.v2 .folio{font-family:var(--num);font-size:.64rem;letter-spacing:.34em;color:var(--blue);margin:0 0 16px}
.v2 h1{margin:0;font-family:var(--corm);font-weight:300;font-size:clamp(3.4rem,7vw,5.6rem);
 line-height:.9;letter-spacing:-.03em}
.v2 .rule{width:44px;height:1px;background:var(--ink);margin:22px 0 14px}
.v2 p{margin:0;font-size:.84rem;line-height:1.7;color:var(--dim);max-width:26ch}
.v2 .r{background:#eef2f3;display:flex;align-items:center;justify-content:center;padding:38px}
.v2 .r i{display:block;width:100%;max-width:330px;aspect-ratio:1;border-radius:50%;overflow:hidden}
.v2 .r img{width:100%;height:100%;object-fit:cover;display:block}

/* 3 標本 */
.v3{padding:44px 0 26px;border-bottom:1px solid var(--ink)}
.v3 h1{margin:0 0 20px;font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,5vw,3.6rem);
 letter-spacing:.06em;line-height:1}
.v3 dl{display:grid;grid-template-columns:repeat(4,auto);gap:0 44px;margin:0;
 border-top:1px solid var(--line);padding-top:14px;width:max-content}
.v3 dt{font-family:var(--num);font-size:.58rem;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.v3 dd{margin:5px 0 0;font-family:var(--num);font-size:1.05rem;font-weight:600}

/* 4 暗房 */
.v4{background:#0d1a1f;color:var(--raw);padding:52px 0;position:relative;overflow:hidden}
.v4::before{content:'';position:absolute;left:50%;top:-30%;width:70%;height:150%;
 transform:translateX(-50%);pointer-events:none;
 background:radial-gradient(50% 50% at 50% 40%,rgba(253,248,243,.13),transparent 70%)}
.v4 .in{position:relative;z-index:2;display:flex;align-items:center;gap:44px}
.v4 i{flex:none;width:min(210px,24vw);aspect-ratio:1;border-radius:12px;overflow:hidden;
 box-shadow:0 40px 70px -30px rgba(0,0,0,.8)}
.v4 img{width:100%;height:100%;object-fit:cover;display:block}
.v4 h1{margin:0;font-family:var(--corm);font-weight:300;font-size:clamp(3rem,6.4vw,5rem);
 line-height:.95;letter-spacing:-.02em}
.v4 p{margin:12px 0 0;font-family:var(--num);font-size:.74rem;font-weight:600;letter-spacing:.14em;
 color:rgba(253,248,243,.55)}

/* 5 色域 */
.v5{background:linear-gradient(152deg,#8fc0cf 0%,#6da3b5 42%,#40798c 100%);
 padding:74px 0;text-align:center;color:#fff}
.v5 h1{margin:0;font-family:var(--corm);font-weight:300;font-size:clamp(3.6rem,9vw,7rem);
 line-height:.9;letter-spacing:-.03em}
.v5 p{margin:18px 0 0;font-family:var(--num);font-size:.74rem;font-weight:600;letter-spacing:.22em;
 color:rgba(255,255,255,.8)}

/* 6 貨牆 */
.v6{position:relative}
.v6 .wall{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#e6e9ea}
.v6 .wall span{display:block;aspect-ratio:4/5;overflow:hidden;background:#f6f7f8}
.v6 .wall img{width:100%;height:100%;object-fit:cover;display:block}
.v6 h1{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;text-align:center;
 font-family:var(--corm);font-weight:400;font-size:clamp(4rem,13vw,11rem);line-height:1;
 letter-spacing:-.04em;color:#fff;mix-blend-mode:difference;pointer-events:none}
.v6 .n{position:absolute;right:16px;bottom:12px;font-family:var(--num);font-size:.72rem;
 font-weight:700;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.6)}

/* 7 一句 */
.v7{padding:60px 0 34px;border-bottom:1px solid var(--line)}
.v7 p{margin:0;font-family:var(--corm);font-weight:300;font-size:clamp(1.9rem,4.6vw,3.4rem);
 line-height:1.42;letter-spacing:-.01em;max-width:20ch}
.v7 b{font-weight:500;font-family:var(--serif);font-size:.92em}
.v7 u{text-decoration:none;font-family:var(--num);font-weight:600;font-size:.66em;
 color:var(--blue);vertical-align:.32em;margin-left:.2em}

/* 8 索引 */
.v8{padding:40px 0 8px}
.v8 .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.v8 h1{margin:0;font-family:var(--corm);font-weight:300;font-size:clamp(2.4rem,5vw,3.6rem);
 line-height:1;letter-spacing:-.02em}
.v8 .tot{font-family:var(--num);font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--dim)}
.v8 ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.v8 li{border-bottom:1px solid var(--line)}
.v8 a{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:baseline;gap:16px;padding:15px 2px;
 transition:padding-left 340ms var(--out),background-color 340ms var(--out)}
.v8 a:hover{padding-left:16px;background:rgba(109,163,181,.07)}
.v8 .i{font-family:var(--corm);font-size:.94rem;color:var(--blue)}
.v8 .t{font-family:var(--serif);font-weight:300;font-size:clamp(1.15rem,2.2vw,1.7rem)}
.v8 .c{font-family:var(--num);font-size:.9rem;font-weight:600;color:var(--dim)}

/* 9 本週 */
.v9{padding:44px 0 22px;border-bottom:1px solid var(--line)}
.v9 .lead{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.v9 .big{font-family:var(--num);font-weight:800;font-size:clamp(3.4rem,8vw,6rem);line-height:.86;
 letter-spacing:-.05em}
.v9 .say{font-family:var(--serif);font-weight:300;font-size:clamp(1.1rem,2.2vw,1.6rem);
 line-height:1.4;padding-bottom:.5rem}
.v9 .sub{margin:20px 0 0;display:flex;align-items:baseline;gap:12px}
.v9 h1{margin:0;font-family:var(--serif);font-weight:500;font-size:1.25rem;letter-spacing:.02em}
.v9 .n{font-family:var(--num);font-size:.76rem;font-weight:700;color:var(--dim)}
.v9 .row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.v9 .row i{display:block;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#f6f7f8}
.v9 .row img{width:100%;height:100%;object-fit:cover;display:block}

/* 10 鏡面 */
.v10{background:linear-gradient(180deg,#f2f4f4 0%,#e6ebec 58%,#dfe5e7 100%);
 padding:52px 0 0;overflow:hidden}
.v10 h1{margin:0;text-align:center;font-family:var(--corm);font-weight:300;
 font-size:clamp(4rem,11vw,9rem);line-height:.86;letter-spacing:-.04em;color:var(--ink)}
.v10 .refl{text-align:center;font-family:var(--corm);font-weight:300;
 font-size:clamp(4rem,11vw,9rem);line-height:.86;letter-spacing:-.04em;color:var(--ink);
 transform:scaleY(-1);opacity:.16;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 62%);
 mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 62%);margin-top:2px}
.v10 p{margin:-1.2em 0 0;text-align:center;position:relative;z-index:2;
 font-family:var(--num);font-size:.74rem;font-weight:600;letter-spacing:.24em;color:var(--dim)}

@media (max-width:900px){
 .grid,.tiles,.v9 .row{grid-template-columns:repeat(2,1fr)}

 .v2,.v6 .wall{grid-template-columns:1fr}.v4 .in{flex-direction:column;align-items:flex-start;gap:22px}
 .v3 dl{grid-template-columns:repeat(2,auto);gap:14px 30px}}

 <a class="tile" href="#"><i><img src="${w(c.picks[0].img,240)}" alt="" loading="lazy"></i>

 <span class="sp"><button>篩選</button><button>排序：推薦 ▾</button></span></div>`;

  <b>${q(p.v)}</b><span>${q(p.t.slice(0,26))}</span></a>`).join('')}</div></div>`;
const body=(head)=>shell()+head+`<div class="frame">${tiles()}${tools()}</div>`+grid();

const variants=[

/* 3 標本 */()=>body(`<section class="v3"><div class="frame"><h1>彩妝</h1>
  <dl><dt>Items</dt><dd>${TOT}</dd><dt>Brands</dt><dd>23</dd>
   <dt>From</dt><dd>HK$${LOW}</dd><dt>Origin</dt><dd>KR</dd></dl></div></section>`),
/* 4 暗房 */()=>body(`<section class="v4"><div class="frame in">
  <i><img src="${w(HERO.img,520)}" alt=""></i>
  <div><h1>彩妝</h1><p>${TOT} 件 · 23 個品牌</p></div></div></section>`),
/* 5 色域 */()=>body(`<section class="v5"><div class="frame">

/* 6 貨牆 */()=>body(`<section class="v6"><div class="wall">${ALL.slice(0,5).map(p=>`

/* 8 索引 */()=>body(`<section class="v8"><div class="frame">

 </div></section>`),

];
const wire=variants.map(()=>()=>{
 document.querySelectorAll('.mark').forEach(e=>e.remove());
 const g=document.getElementById('grid');if(!g)return;
 const y=Math.round(g.querySelector('.pc').getBoundingClientRect().top+scrollY);
 const m=document.createElement('div');m.className='mark';m.style.top=y+'px';
 m.innerHTML=`<span>第一件貨 ${y}px　·　Olive Young 係 219px</span>`;
 document.body.appendChild(m);});
const stage=document.getElementById('stage');const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';
 highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();(wire[i]||(()=>{}))();});}
function setActive(i){if(i<0||i>=variants.length)return;current=i;
 items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);
  if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});
 moveHighlight();const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(e)=>{
 if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
 if(e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);
 if(n>=1&&n<=variants.length)setActive(n-1);
 else if(e.key==='ArrowRight')setActive((current+1)%variants.length);
 else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
 else if(e.key==='r'||e.key==='R')mount(current);});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></body></html>
